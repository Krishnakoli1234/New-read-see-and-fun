<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Content Hub</title>
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .tab-active { border-bottom: 3px solid #2563eb; color: #2563eb; font-weight: bold; }
        .ad-banner { background: repeating-linear-gradient(45deg, #e5e7eb, #e5e7eb 10px, #f3f4f6 10px, #f3f4f6 20px); border: 2px dashed #9ca3af; display: flex; align-items: center; justify-content: center; color: #6b7280; font-weight: bold; margin: 20px 0; }
        .modal { transition: opacity 0.3s ease; }
        .hidden-modal { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <span class="text-2xl font-bold text-blue-600"><i class="fas fa-layer-group mr-2"></i>MediaHub</span>
                    <div class="hidden md:flex ml-10 space-x-8">
                        <button onclick="switchTab('articles')" id="tab-articles" class="tab-active px-3 py-2 text-sm font-medium text-gray-700 hover:text-blue-600 transition">Articles</button>
                        <button onclick="switchTab('videos')" id="tab-videos" class="px-3 py-2 text-sm font-medium text-gray-700 hover:text-blue-600 transition">Videos</button>
                        <button onclick="switchTab('gallery')" id="tab-gallery" class="px-3 py-2 text-sm font-medium text-gray-700 hover:text-blue-600 transition">Gallery</button>
                    </div>
                </div>
                <div class="flex items-center">
                    <!-- Right Corner Admin Button -->
                    <button id="authBtn" onclick="toggleLoginModal()" class="bg-gray-800 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-gray-700">
                        <i class="fas fa-lock mr-2"></i>Admin Login
                    </button>
                    <button id="logoutBtn" onclick="logout()" class="hidden bg-red-500 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-red-600">
                        Logout
                    </button>
                </div>
            </div>
        </div>
        <!-- Mobile Menu -->
        <div class="flex md:hidden justify-around bg-gray-50 p-2 border-t">
            <button onclick="switchTab('articles')" class="text-sm font-medium text-gray-600">Articles</button>
            <button onclick="switchTab('videos')" class="text-sm font-medium text-gray-600">Videos</button>
            <button onclick="switchTab('gallery')" class="text-sm font-medium text-gray-600">Images</button>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- Top Ad Space -->
        <div id="top-ad" class="ad-banner h-24 rounded-lg hidden">
            <span>Sponsored Ad Banner (728x90)</span>
        </div>

        <!-- Admin Dashboard (Only Visible to Admin) -->
        <div id="adminPanel" class="hidden mb-8 bg-white p-6 rounded-lg shadow-lg border-l-4 border-blue-600">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-800">Admin Dashboard</h2>
                <div class="flex items-center space-x-2">
                    <span class="text-sm font-medium">Ads Status:</span>
                    <button onclick="toggleAds()" id="adToggleBtn" class="bg-green-500 text-white px-3 py-1 rounded text-sm">ON</button>
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- Add Article Form -->
                <div class="border p-4 rounded bg-gray-50">
                    <h3 class="font-bold mb-2 text-blue-600">Add Article</h3>
                    <input type="text" id="artTitle" placeholder="Title" class="w-full mb-2 p-2 border rounded">
                    <textarea id="artContent" placeholder="Content..." class="w-full mb-2 p-2 border rounded h-20"></textarea>
                    <input type="text" id="artImg" placeholder="Image URL" class="w-full mb-2 p-2 border rounded">
                    <button onclick="addContent('article')" class="w-full bg-blue-600 text-white py-1 rounded hover:bg-blue-700">Post Article</button>
                </div>

                <!-- Add Video Form -->
                <div class="border p-4 rounded bg-gray-50">
                    <h3 class="font-bold mb-2 text-red-600">Add Video</h3>
                    <input type="text" id="vidTitle" placeholder="Video Title" class="w-full mb-2 p-2 border rounded">
                    <input type="text" id="vidUrl" placeholder="YouTube Embed URL" class="w-full mb-2 p-2 border rounded">
                    <p class="text-xs text-gray-500 mb-2">Use Embed URL (e.g., youtube.com/embed/xyz)</p>
                    <button onclick="addContent('video')" class="w-full bg-red-600 text-white py-1 rounded hover:bg-red-700">Post Video</button>
                </div>

                <!-- Add Image Form -->
                <div class="border p-4 rounded bg-gray-50">
                    <h3 class="font-bold mb-2 text-purple-600">Add to Gallery</h3>
                    <input type="text" id="imgTitle" placeholder="Caption" class="w-full mb-2 p-2 border rounded">
                    <input type="text" id="imgUrl" placeholder="Image URL" class="w-full mb-2 p-2 border rounded">
                    <button onclick="addContent('image')" class="w-full bg-purple-600 text-white py-1 rounded hover:bg-purple-700">Upload Image</button>
                </div>
            </div>
        </div>

        <!-- CONTENT SECTIONS -->

        <!-- Articles Section -->
        <div id="articles-section" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Articles will appear here -->
        </div>

        <!-- Videos Section -->
        <div id="videos-section" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Videos will appear here -->
        </div>

        <!-- Gallery Section -->
        <div id="gallery-section" class="hidden columns-1 md:columns-3 gap-4 space-y-4">
            <!-- Dynamic Images will appear here -->
        </div>

        <!-- Bottom Ad Space -->
        <div id="bottom-ad" class="ad-banner h-24 rounded-lg mt-8 hidden">
            <span>Sponsored Ad Banner (Footer)</span>
        </div>

    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden-modal opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white rounded-lg p-8 max-w-sm w-full shadow-2xl transform transition-all">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-gray-900">Admin Login</h3>
                <button onclick="toggleLoginModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Username</label>
                    <input type="text" id="usernameInput" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="passwordInput" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div id="loginError" class="text-red-500 text-sm hidden">Invalid credentials! Try admin/admin123</div>
                <button onclick="login()" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">Sign In</button>
            </div>
        </div>
    </div>

    <script>
        // --- DATA MANAGEMENT (Simulating Backend) ---
        
        // Initial Dummy Data if LocalStorage is empty
        const initialData = {
            articles: [
                { id: 1, title: "Future of AI in India", content: "Artificial Intelligence is growing rapidly in Indian tech sectors...", img: "https://images.unsplash.com/photo-1677442136019-21780ecad995?w=500&auto=format&fit=crop&q=60" },
                { id: 2, title: "Top 10 Tourist Places", content: "From the Taj Mahal to Kerala backwaters, explore India...", img: "https://images.unsplash.com/photo-1524492412937-b28074a5d7da?w=500&auto=format&fit=crop&q=60" }
            ],
            videos: [
                { id: 1, title: "Nature Relaxation", url: "https://www.youtube.com/embed/BHACKCNDMW8" }, // Sample Embed
                { id: 2, title: "Coding Setup", url: "https://www.youtube.com/embed/FzFn2A4aYxI" }
            ],
            gallery: [
                { id: 1, title: "Mountain View", url: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=500&auto=format&fit=crop&q=60" },
                { id: 2, title: "City Lights", url: "https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=500&auto=format&fit=crop&q=60" },
                { id: 3, title: "Technology", url: "https://images.unsplash.com/photo-1518770660439-4636190af475?w=500&auto=format&fit=crop&q=60" }
            ],
            adsEnabled: true
        };

        // Load data or initialize
        let appData = JSON.parse(localStorage.getItem('myCmsData')) || initialData;
        let isAdmin = false;

        // --- AUTHENTICATION LOGIC ---

        function toggleLoginModal() {
            const modal = document.getElementById('loginModal');
            if (modal.classList.contains('hidden-modal')) {
                modal.classList.remove('hidden-modal', 'opacity-0', 'pointer-events-none');
            } else {
                modal.classList.add('hidden-modal', 'opacity-0', 'pointer-events-none');
            }
            document.getElementById('loginError').classList.add('hidden');
        }

        function login() {
            const user = document.getElementById('usernameInput').value;
            const pass = document.getElementById('passwordInput').value;

            if (user === 'admin' && pass === 'admin123') {
                isAdmin = true;
                document.getElementById('authBtn').classList.add('hidden');
                document.getElementById('logoutBtn').classList.remove('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                toggleLoginModal();
                renderAll();
                alert("Welcome Admin!");
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function logout() {
            isAdmin = false;
            document.getElementById('authBtn').classList.remove('hidden');
            document.getElementById('logoutBtn').classList.add('hidden');
            document.getElementById('adminPanel').classList.add('hidden');
            renderAll();
        }

        // --- RENDERING LOGIC ---

        function saveData() {
            localStorage.setItem('myCmsData', JSON.stringify(appData));
            renderAll();
        }

        function renderAll() {
            renderAds();
            renderArticles();
            renderVideos();
            renderGallery();
            updateAdButton();
        }

        function renderAds() {
            const display = appData.adsEnabled ? 'flex' : 'none';
            document.getElementById('top-ad').style.display = display;
            document.getElementById('bottom-ad').style.display = display;
        }

        function updateAdButton() {
            const btn = document.getElementById('adToggleBtn');
            if(appData.adsEnabled) {
                btn.textContent = "ON";
                btn.className = "bg-green-500 text-white px-3 py-1 rounded text-sm";
            } else {
                btn.textContent = "OFF";
                btn.className = "bg-red-500 text-white px-3 py-1 rounded text-sm";
            }
        }

        function toggleAds() {
            appData.adsEnabled = !appData.adsEnabled;
            saveData();
        }

        function renderArticles() {
            const container = document.getElementById('articles-section');
            container.innerHTML = appData.articles.map((art, index) => `
                <div class="bg-white rounded-lg shadow overflow-hidden hover:shadow-xl transition relative">
                    ${isAdmin ? `<button onclick="deleteItem('articles', ${index})" class="absolute top-2 right-2 bg-red-600 text-white p-1 rounded-full w-8 h-8 hover:bg-red-700 z-10"><i class="fas fa-trash"></i></button>` : ''}
                    <img src="${art.img}" class="w-full h-48 object-cover" onerror="this.src='https://via.placeholder.com/400x200'">
                    <div class="p-4">
                        <h3 class="font-bold text-lg mb-2 text-gray-800">${art.title}</h3>
                        <p class="text-gray-600 text-sm line-clamp-3">${art.content}</p>
                        <button class="mt-4 text-blue-600 font-semibold text-sm hover:underline">Read More</button>
                    </div>
                    ${appData.adsEnabled ? '<div class="h-1 bg-gray-100 border-t text-xs text-center text-gray-400 py-1">Ad Space</div>' : ''}
                </div>
            `).join('');
        }

        function renderVideos() {
            const container = document.getElementById('videos-section');
            container.innerHTML = appData.videos.map((vid, index) => `
                <div class="bg-white rounded-lg shadow overflow-hidden relative">
                    ${isAdmin ? `<button onclick="deleteItem('videos', ${index})" class="absolute top-2 right-2 bg-red-600 text-white p-1 rounded-full w-8 h-8 hover:bg-red-700 z-10"><i class="fas fa-trash"></i></button>` : ''}
                    <div class="aspect-w-16 aspect-h-9">
                        <iframe src="${vid.url}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen class="w-full h-56"></iframe>
                    </div>
                    <div class="p-3">
                        <h3 class="font-bold text-gray-800">${vid.title}</h3>
                    </div>
                </div>
            `).join('');
        }

        function renderGallery() {
            const container = document.getElementById('gallery-section');
            container.innerHTML = appData.gallery.map((img, index) => `
                <div class="mb-4 relative group break-inside-avoid">
                    ${isAdmin ? `<button onclick="deleteItem('gallery', ${index})" class="absolute top-2 right-2 bg-red-600 text-white p-1 rounded-full w-8 h-8 hover:bg-red-700 opacity-0 group-hover:opacity-100 transition"><i class="fas fa-trash"></i></button>` : ''}
                    <img src="${img.url}" class="w-full rounded-lg shadow-md" alt="${img.title}">
                    <div class="absolute bottom-0 left-0 bg-gradient-to-t from-black to-transparent w-full p-2 rounded-b-lg opacity-0 group-hover:opacity-100 transition">
                        <p class="text-white text-xs">${img.title}</p>
                    </div>
                </div>
            `).join('');
        }

        // --- ADMIN ACTIONS ---

        function addContent(type) {
            if (!isAdmin) return;

            if (type === 'article') {
                const title = document.getElementById('artTitle').value;
                const content = document.getElementById('artContent').value;
                const img = document.getElementById('artImg').value;
                if (!title || !content) return alert("Title and Content required");
                
                appData.articles.unshift({ title, content, img: img || 'https://via.placeholder.com/400x200' });
                // Clear inputs
                document.getElementById('artTitle').value = '';
                document.getElementById('artContent').value = '';
                document.getElementById('artImg').value = '';
            } 
            else if (type === 'video') {
                const title = document.getElementById('vidTitle').value;
                const url = document.getElementById('vidUrl').value;
                if (!url) return alert("URL required");

                appData.videos.unshift({ title: title || "New Video", url });
                document.getElementById('vidTitle').value = '';
                document.getElementById('vidUrl').value = '';
            }
            else if (type === 'image') {
                const title = document.getElementById('imgTitle').value;
                const url = document.getElementById('imgUrl').value;
                if (!url) return alert("Image URL required");

                appData.gallery.unshift({ title: title || "Image", url });
                document.getElementById('imgTitle').value = '';
                document.getElementById('imgUrl').value = '';
            }
            saveData();
        }

        function deleteItem(type, index) {
            if(confirm("Are you sure you want to delete this?")) {
                appData[type].splice(index, 1);
                saveData();
            }
        }

        // --- TAB NAVIGATION ---

        function switchTab(tabName) {
            // Hide all sections
            document.getElementById('articles-section').classList.add('hidden');
            document.getElementById('videos-section').classList.add('hidden');
            document.getElementById('gallery-section').classList.add('hidden');
            
            // Reset Tab Styles
            document.getElementById('tab-articles').classList.remove('tab-active', 'text-blue-600');
            document.getElementById('tab-videos').classList.remove('tab-active', 'text-blue-600');
            document.getElementById('tab-gallery').classList.remove('tab-active', 'text-blue-600');
            
            // Show Active
            document.getElementById(`${tabName}-section`).classList.remove('hidden');
            document.getElementById(`tab-${tabName}`).classList.add('tab-active');
        }

        // Initialize App
        renderAll();
        switchTab('articles'); // Default view

    </script>
